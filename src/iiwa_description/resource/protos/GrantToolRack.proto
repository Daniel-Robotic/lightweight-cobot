#VRML_SIM R2025a utf8

# Original-size grant magazine. The sealant OBJ export is 10 times smaller
# than the other tool meshes, so scale only that tool visual.
# The OBJ meshes use Y as vertical; the default rotation maps Y to world Z.
PROTO GrantToolRack [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 1 0 0 1.57079632679
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name "grant_tool_magazine"
    locked TRUE
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 0.72 0.47 0.14
          roughness 0.56
          metalness 0.35
        }
        geometry Mesh {
          url [ "../../objects/grant/tool-magizine.obj" ]
        }
      }
      Solid {
        translation -0.135 0.01 0
        name "grant_vacuum_tool_docked"
        locked TRUE
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.16 0.47 0.72
              roughness 0.5
              metalness 0.25
            }
            geometry Mesh {
              url [ "../../objects/grant/vacum-tool.obj" ]
            }
          }
        ]
        boundingObject Pose {
          translation 0.00054 0.07 0
          children [ Box { size 0.0821 0.14 0.081 } ]
        }
      }
      Solid {
        translation -0.045 0.01 0
        name "grant_magnetic_tool_docked"
        locked TRUE
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.43 0.30 0.65
              roughness 0.4
              metalness 0.45
            }
            geometry Mesh {
              url [ "../../objects/grant/magnit-tool.obj" ]
            }
          }
        ]
        boundingObject Pose {
          translation 0 0.07 0
          children [ Box { size 0.036 0.14 0.036 } ]
        }
      }
      Solid {
        translation 0.045 0.01 0
        name "grant_sealant_tool_docked"
        locked TRUE
        children [
          Transform {
            scale 10 10 10
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.23 0.57 0.31
                  roughness 0.6
                  metalness 0.15
                }
                geometry Mesh {
                  url [ "../../objects/grant/germetic-tool.obj" ]
                }
              }
            ]
          }
        ]
        boundingObject Pose {
          translation 0 0.07 0
          children [ Box { size 0.05608 0.14 0.05608 } ]
        }
      }
      Solid {
        translation 0.135 0.01 0
        name "grant_wrench_tool_docked"
        locked TRUE
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.80 0.32 0.18
              roughness 0.4
              metalness 0.45
            }
            geometry Mesh {
              url [ "../../objects/grant/wranch-tool.obj" ]
            }
          }
        ]
        boundingObject Pose {
          translation 0 0.07 0
          children [ Box { size 0.049 0.14 0.049 } ]
        }
      }
    ]
    boundingObject Pose {
      translation 0 0.005 0
      children [ Box { size 0.42 0.01 0.14 } ]
    }
  }
}
