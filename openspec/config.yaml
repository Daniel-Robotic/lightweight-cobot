schema: spec-driven

context: |
  Пиши артефакты по-русски. Сохраняй структурные заголовки OpenSpec и SHALL/MUST.
  Проект: Lightweight Cobot, Ubuntu 24.04, ROS 2 Jazzy, KUKA LBR iiwa 7 R800,
  Sunrise/FRI 1.16, ros2_control, MoveIt 2, Webots 2025a.
  Базовые контракты реализованной системы находятся в openspec/specs/.
  Для движения различай Webots и физический робот; физическую проверку не
  подразумевай без оператора, проверки сети, лимитов, инструмента и Load Data.
  Учитывай рабочие изменения пользователя; не правь external/libFRI без запроса.

rules:
  specs:
    - Указывай единицы, систему координат, отказ и проверяемый сценарий для команд движения.
    - Отделяй реализованное поведение от предлагаемого изменения.
  tasks:
    - Для движения сначала планируй симуляционную проверку, затем отдельную проверку на физическом роботе при разрешении оператора.
