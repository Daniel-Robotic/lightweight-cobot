site_name: Документация LWC
site_url: https://daniel-robotic.github.io/lightweight-cobot/
site_description: Документация по использованию коллаборативного робота KUKA LBR iiwa 7 и его программированию в среде ROS 2.
site_author: Даниил Грабарь

theme:
  name: material
  custom_dir: overrides
  language: ru
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.tabs.link      # синхронизирует все табы с одинаковым названием по всему сайту
    - content.code.copy      # кнопка "копировать" у код-блоков

plugins:
  - search
  - to-pdf:
      author: Даниил Грабарь
      cover_title: Документация LWC
      cover_subtitle: Lightweight Cobot
      output_path: pdf/documentation.pdf

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/pdf_button.js

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Главная: index.md

  - Быстрый старт:
    - Обзор: getting-started/overview.md
    - Настройка SunriseWorkbench: getting-started/sunrise-setup.md
    - Подключение к серверу: getting-started/remote-access.md
    - Установка проекта: getting-started/installation.md
    - CLI-команды cobot: getting-started/cli-reference.md
    - Конфигурация системы: getting-started/configuration.md
    - Управление:
      - ROS2 (Bash): getting-started/control/ros2-control.md
      - Foxglove Studio: getting-started/control/foxglove.md
      - REST API: getting-started/control/rest-api.md

  - Sunrise Workbench:
    - Обзор: sunrise/overview.md
    - Установка:
      - Windows: sunrise/sun_install/windows.md
      - Linux:
        - Обзор: sunrise/sun_install/linux/linux.md
        - Установка эмулятора Windows: sunrise/sun_install/linux/emulator.md
        - Установка SunriseWorkbench: sunrise/sun_install/linux/workbench.md
    - Конфигурация проекта:
      - Создание нового проекта: sunrise/config/new-project.md
      - Загрузка готового проекта: sunrise/config/load-project.md
      - Установка библиотек: sunrise/config/libraries.md
    - KUKA LBR IIWA 7:
      - Описание программ:
        - TeachKuka: sunrise/kuka/programs/teach-kuka.md
        - LBRserver: sunrise/kuka/programs/lbr-server.md
        - RobotPowerControl: sunrise/kuka/programs/robot-power-control.md
      - Функциональные возможности:
        - Станция: sunrise/kuka/features/station.md
        - Дополнительное меню: sunrise/kuka/features/extra-menu.md
        - Приложения: sunrise/kuka/features/applications.md
        - Меню робота: sunrise/kuka/features/robot-menu.md
        - Меню IO Group: sunrise/kuka/features/io-group.md
  - Решение проблем:
    - Ошибка конфигурации: troubleshooting/config-error.md


