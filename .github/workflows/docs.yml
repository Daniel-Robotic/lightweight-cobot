name: Документация

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (WeasyPrint/PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcairo2 libpango-1.0-0 libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev \
            fontconfig fonts-dejavu

      - name: Install MkDocs
        run: pip install mkdocs-material mkdocs-to-pdf

      - name: Build Documentation
        env:
          ENABLE_PDF_EXPORT: "1"
        run: mkdocs build
        working-directory: doc/lwc-doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1.0.0
        with:
          path: doc/lwc-doc/site/

  deploy-github:
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  deploy-gitverse:
    if: github.server_url != 'https://github.com'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitVerse Pages
        uses: actions/deploy-pages@v1.0.0
